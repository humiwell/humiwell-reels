# Humiwell trial reel auto-publisher settings.
# Edit this file on GitHub (pencil icon), then "Commit changes".
# The next run (within 15 minutes) uses the new settings.

# true = post nothing at all. Results and token reminders still run.
paused: false

# true = practice mode. The robot shows what it WOULD post, but posts nothing.
# Set to false only after the test reel has passed.
dry_run: false

# Posting times, UK time (summer time is handled for you).
timezone: Europe/London
slots: ["07:00", "08:30", "10:00", "12:00", "14:00", "17:00", "19:00", "21:00"]
# From 27 Nov 2026 B-roll days have 4 versions (A, B, F and one challenger). A day with 4 or fewer
# versions posts at these times instead, so they spread over the day.
slots_4_versions: ["08:00", "12:30", "17:00", "20:30"]

# If runs were missed, the robot catches up, but posts at most this many per run.
max_posts_per_run: 2

# GitHub starts the robot only about once an hour. To post on time, a run stays awake
# until the next slot if it is at most this many minutes away...
wait_for_slot_minutes: 180
# ...and one run never stays awake longer than this (GitHub's limit is 360).
max_run_minutes: 300
# While it waits, an awake run checks GitHub this often (minutes), so a new batch, a config edit or a
# post-now request (requests/post_now.json) is acted on within this time, not at the next slot.
nap_minutes: 5

# Videos left unposted (for example while audio fails) wait in the queue.
# After a daily limit nothing waits: the rest of that day is dropped so tomorrow stays on schedule.
# Videos older than this many days are dropped instead (an issue tells you).
max_carry_days: 2

# Where Instagram downloads the videos from: release | pages | raw
#   release = GitHub Release files (default)
#   pages   = GitHub Pages copy (needs Pages turned on for the "media" branch)
#   raw     = plain file links from the "media" branch
hosting: release

# Note: videos are always handed to Instagram by link. The other ("resumable") upload
# was tested on 2026-11-10 and drops BOTH the audio and the trial setting.

# Trial reel setting. MANUAL = you decide which reel to share with followers.
graduation_strategy: MANUAL

audio:
  enabled: true
  # true = never post without trending audio. If Instagram refuses the audio,
  # nothing is posted, the queue waits, and the robot tries again every hour.
  required: true
  # Which kind of trending sound to use first: music | original_sound
  prefer: music
  # If nothing usable is found in the first kind, try the other kind.
  fallback_to_other_type: true
  # Put a track id here to use that track for every reel ("" = top trending).
  pin_audio_id: ""
  # Or pin a track for one day only, for example:  "2026-11-16": "1234567890"
  pin_by_date: {}
  # B-roll trial reels only ever use these tracks (Sajjad's list, 28 Nov 2026). The robot rotates
  # through them by date and never falls back to trending. A manifest or pin outside the list is
  # skipped. Leave empty to go back to trending. Talking head and song reels are not affected.
  # IMPORTANT: these must be the robot's own track ids (from Test reel > audio-shortlist with a search),
  # NOT the number in an instagram.com/reels/audio/<number> link: Instagram refuses those (error 2207065).
  # Of Sajjad's 7 picks only these 2 are in the library the robot may use (checked 28 Nov 2026):
  #   1418611098781784 = Too Cool (Giulio Cercato)           [app link id 455812557024565]
  #   2269234066500713 = Beautiful, You Are (Ruby Amanfu)    [app link id 249449497488410, instrumental not offered]
  # Not available to the robot: Apocalypse (Cigarettes After Sex), The Journey (Sol Rising),
  # Bloom (The Paper Kites), In The Forest (Lesfm), Trust The Process (Slowheal).
  approved_ids: ["1418611098781784", "2269234066500713"]
  # Never use these track ids.
  block_ids: []
  # Never use tracks whose title or artist contains any of these words.
  block_words: ["Remembrance", "Last Post", "Diwali", "Christmas", "Xmas", "Ramayana", "Satgur", "Ram Aaye", "Bandi Chhor"]
  # Loudness of the trending track, 1 to 100.
  audio_volume: 100
  # Loudness of the video's own sound. Keep 0: our videos are silent, and
  # Instagram refuses the audio (error 2207082) if this is above 0 (tested 2026-11-10).
  video_volume: 0

# Talking-head reels (batches/th-YYYY-MM-DD/): 4 hook versions with the speaker's voice.
# They post in their own slots, so B-roll timing does not change.
talking_head:
  enabled: true
  # Cut to 2 a day on 17 Nov 2026 to stay under Instagram's trial reel cap (8 B-roll + 2 = 10 a day).
  slots: ["13:00", "18:00"]
  # One trending instrumental track for all 4 versions, quiet under the voice (1 to 100). 12 approved 16 Nov 2026.
  audio_volume: 12
  # The video's own sound (the voice). Must stay on for talking head.
  video_volume: 100
  # Winner issue this many days after the trial date (at results: issue_time).
  issue_days_after: 2

# Song reels (batches/song-YYYY-MM-DD/): ONE version a day, lip-synced to our own AI song.
# The song in the video is the only sound: the robot never adds a track and keeps the video's volume.
song:
  enabled: true
  slots: ["18:30"]
  # Scorecard issue this many days after the trial date (at results: issue_time).
  issue_days_after: 2

results:
  # The winner issue opens at this UK time, this many days after the trial date
  # (trial on 12 Nov -> issue on 15 Nov at 17:00), using whatever data exists by then.
  issue_days_after: 3
  issue_time: "17:00"
  # A lead is trusted only if both top versions reach this many people...
  min_reach: 150
  # ...and the watch % gap is at least this many points.
  min_gap_points: 10
  # Unit Instagram uses for average watch time: ms or s
  avg_watch_time_unit: ms

# Notion calendars (28 Nov 2026). As soon as the first version of a day is posted, its Notion row gets Status "Posted".
# When the winner issue is written (B-roll and talking head), the row gets Winner / Winner hook /
# Winner link / Winner note (whichever the database has). Needs the NOTION_TOKEN secret. Posting never waits for it.
notion:
  enabled: true
  posted_status: "Posted"
  # Only days with a trial date on or after this are updated (older rows were tidied by hand).
  start_date: "2026-11-28"
  broll:
    data_source: "396a51a3-46ad-49e7-945d-e6d69fcf7253"   # Reels
    days_after_trial: 3                                   # Notion date = trial date + 3
  talking_head:
    data_source: "419f6635-23bd-816f-bb0f-000b800d400d"   # Talking heads
    days_after_trial: 0
  song:
    data_source: "41bf6635-23bd-8168-aac1-000b28cdafb6"   # Songs
    days_after_trial: 0

token:
  # Open a reminder issue this many days before the Instagram token runs out.
  warn_days_before_expiry: 10
  # Try to renew the token automatically (needs the GH_SECRETS_TOKEN secret, see README).
  auto_renew: true

# Weekly hashtag research (Actions tab, "Hashtag research"). Read-only, posts nothing.
# Instagram allows 30 different hashtags per 7 days for the account, so keep this list at 30 or fewer.
# Write them without the # sign.
hashtags:
  tags: [guthealth, guthealthtips, ukwellness, wellnesstips, nutritiontips, healthyeatinguk,
         blackseedoil, kalonji, magnesium, menopausesupport, perimenopause, fibre,
         highprotein, mealprepuk, ultraprocessedfood]
  # How many top posts to show per hashtag.
  top_posts: 8

graph_api_version: v27.0
