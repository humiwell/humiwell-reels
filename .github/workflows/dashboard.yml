# Read-only: once a day, saves account numbers for the Humiwell Command Center dashboard
# (dashboard/account.json, followers.csv, daily.json and media.json). Never posts anything.
name: Dashboard data

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only reads Instagram, so it has its own queue and never waits for (or bumps) the robot.
  group: dashboard-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read account numbers
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: python -m reels account
      - name: Save dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Dashboard: account snapshot"
          for i in 1 2; do
            git pull --rebase --quiet && git push --quiet && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
