# Weekly hashtag research. Read-only: looks up public posts for the hashtags in config.yml,
# saves research/hashtags/<date>.md and opens a summary issue. Posts nothing.
name: Hashtag research

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC (06:00 or 07:00 UK)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hashtag-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research hashtags
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m reels hashtags
      - name: Save the report
        if: always()
        run: |
          git config user.name "reels-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d research ]; then git add research; fi
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Robot: hashtag research"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 10
          done
          exit 1
