# The robot. Runs every 15 minutes: token check, post due reels, judge 72 h old reels.
name: Reels robot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Force practice mode for this run (posts nothing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: reels-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post and report
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m reels run
      - name: Save progress
        if: always()
        run: |
          git config user.name "reels-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in state results results.csv; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Robot: update state and results"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 10
          done
          exit 1
