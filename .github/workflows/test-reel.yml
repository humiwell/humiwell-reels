# One-off tests for the unknowns. Run by hand from the Actions tab.
#   check    = read-only checks + uploads that are never published (safe)
#   post     = publishes ONE test trial reel (only if confirm is POST)
#   insights = reads the numbers of that test reel
#   audio-shortlist = lists trending music with every field, or search results (read-only)
name: Test reel

on:
  workflow_dispatch:
    inputs:
      step:
        type: choice
        options: [check, post, insights, audio-shortlist]
        default: check
      host:
        description: "Video host for the post step"
        type: choice
        options: [release, pages, raw]
        default: release
      confirm:
        description: "Type POST to allow the post step to publish"
        default: ""
      search:
        description: "audio-shortlist only: search words, comma separated (empty = trending list)"
        default: ""
      audio_id:
        description: "post only: track id to use (empty = normal choice)"
        default: ""

permissions:
  contents: write

concurrency:
  # The song finder only reads, so it gets its own queue and never waits for (or bumps) the robot.
  # Every other step can post or save state, so it shares the robot's queue.
  group: ${{ inputs.step == 'audio-shortlist' && 'reels-songs' || 'reels-robot' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make a silent copy of the test video (once)
        if: inputs.step == 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view test --json assets -q '.assets[].name' | grep -qx test-silent.mp4; then exit 0; fi
          sudo apt-get install -y -qq ffmpeg > /dev/null
          gh release download test -p test.mp4 -D /tmp
          ffmpeg -loglevel error -i /tmp/test.mp4 -an -c:v copy /tmp/test-silent.mp4
          gh release upload test /tmp/test-silent.mp4
      - name: Run test step
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          TEST_HOST: ${{ inputs.host }}
          CONFIRM: ${{ inputs.confirm }}
          AUDIO_SEARCH: ${{ inputs.search }}
          TEST_AUDIO_ID: ${{ inputs.audio_id }}
        run: |
          if [ "${{ inputs.step }}" = "audio-shortlist" ]; then python -m reels audio-shortlist
          else python -m reels test-${{ inputs.step }}; fi
      - name: Save test notes
        if: always()
        run: |
          git config user.name "reels-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -e state/test.json ]; then git add state/test.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Robot: test notes"
          git pull --rebase --quiet && git push --quiet
