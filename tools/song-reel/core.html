const CUBE=84,GAP=16;
function cubeRow(y,n,opts){ // opts: appear[i], knock[i], ghostFrom

// behaviours
const fr=x=>x-Math.floor(x);

 switch(name){
  case 'idle':return Object.assign(base,{bob:-Math.abs(Math.sin(t*Math.PI/BEAT))*2});
